# ==============================================================================
# SERVER & GENERAL SETTINGS
# ==============================================================================
spring.application.name=tourism-guide-api
server.port=${PORT:${SERVER_PORT:8080}}
server.address=0.0.0.0
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
# ==============================================================================
# API DOCUMENTATION
# ==============================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Import local override configuration (application-local.properties is gitignored)
spring.config.import=optional:classpath:application-local.properties

# ==============================================================================
# DATABASE CONFIGURATION (PostgreSQL + PostGIS / Neon)
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:tourism_db}?stringtype=unspecified&characterEncoding=UTF-8&sslmode=${DB_SSL_MODE:prefer}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:tourism_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:tourism_password}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Run schema.sql on startup to create tables if they don't exist
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=true

# HikariCP pool optimization for Neon Serverless & Low Memory (512MB RAM)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000

# ==============================================================================
# CACHING (Redis / Upstash TLS)
# ==============================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:${REDIS_SSL_ENABLED:false}}
spring.data.redis.timeout=3000ms

# ==============================================================================
# JSON SERIALIZATION
# ==============================================================================
spring.jackson.serialization.write-dates-as-timestamps=false

# ==============================================================================
# SECURITY & AUTHENTICATION (Secrets managed via ENV or application-local.properties)
# ==============================================================================
jwt.secret=${JWT_SECRET:0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}
jwt.guest.expirationMs=${JWT_GUEST_EXPIRATION_MS:604800000}

# Google OAuth2 configuration
google.oauth2.client-id=${GOOGLE_CLIENT_ID:}

# ==============================================================================
# TELEGRAM BOT CONFIGURATION (OTP Service)
# ==============================================================================
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:smart_tourism_sts_bot}
telegram.bot.test-chat-id=${TELEGRAM_BOT_CHAT_ID:}

# ==============================================================================
# EXTERNAL API KEYS (Configured via ENV or application-local.properties)
# ==============================================================================
app.api.map-key=${MAP_API_KEY:}
app.api.gemini-key=${GEMINI_API_KEY:}
app.api.ai-key=${AI_API_KEY:${GEMINI_API_KEY:${API_KEY:}}}
app.api.ai-model=${AI_MODEL:gemini-3.5-flash-lite}
app.api.weather-key=${WEATHER_API_KEY:}
app.api.tts-key=${TTS_API_KEY:}
app.api.custom-key=${API_KEY:}
app.i18n.supported-locales=${SUPPORTED_LOCALES:vi,en,ja,ko,zh,fr}

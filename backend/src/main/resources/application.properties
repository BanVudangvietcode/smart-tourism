# ==============================================================================
# SERVER & GENERAL SETTINGS
# ==============================================================================
spring.application.name=tourism-guide-api
server.port=${SERVER_PORT:8080}

# Import local override configuration (application-local.properties is gitignored)
spring.config.import=optional:classpath:application-local.properties

# ==============================================================================
# DATABASE CONFIGURATION (PostgreSQL + PostGIS)
# ==============================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:tourism_db}
spring.datasource.username=${POSTGRES_USER:tourism_user}
spring.datasource.password=${POSTGRES_PASSWORD:tourism_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Run schema.sql on startup to create tables if they don't exist
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# HikariCP pool timeouts
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000

# ==============================================================================
# CACHING (Redis)
# ==============================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# ==============================================================================
# JSON SERIALIZATION
# ==============================================================================
spring.jackson.serialization.write-dates-as-timestamps=false

# ==============================================================================
# SECURITY & AUTHENTICATION (Secrets managed via ENV or application-local.properties)
# ==============================================================================
jwt.secret=${JWT_SECRET:0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}
jwt.guest.expirationMs=${JWT_GUEST_EXPIRATION_MS:604800000}

# Google OAuth2 configuration
google.oauth2.client-id=${GOOGLE_CLIENT_ID:}

# ==============================================================================
# TELEGRAM BOT CONFIGURATION (OTP Service)
# ==============================================================================
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.test-chat-id=${TELEGRAM_BOT_CHAT_ID:}

# ==============================================================================
# EXTERNAL API KEYS (Configured via ENV or application-local.properties)
# ==============================================================================
app.api.map-key=${MAP_API_KEY:}
app.api.gemini-key=${GEMINI_API_KEY:}
app.api.weather-key=${WEATHER_API_KEY:}
app.api.tts-key=${TTS_API_KEY:}
app.api.custom-key=${API_KEY:}

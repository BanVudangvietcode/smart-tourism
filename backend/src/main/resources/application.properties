spring.application.name=tourism-guide-api
server.port=${SERVER_PORT:8080}

# PostgreSQL + PostGIS (local defaults match docker-compose.yml)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:tourism_db}
spring.datasource.username=${POSTGRES_USER:tourism_user}
spring.datasource.password=${POSTGRES_PASSWORD:tourism_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Run schema.sql on startup to create tables if they don't exist
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Keep health checks responsive when the database cannot be reached.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000

# ISO-8601 timestamps in JSON responses.
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT configuration
jwt.secret=0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF
jwt.expirationMs=86400000
jwt.guest.expirationMs=604800000

# Google OAuth2 configuration
google.oauth2.client-id=${GOOGLE_CLIENT_ID:}

